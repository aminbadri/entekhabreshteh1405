name: Build 1405 data pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 5"

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-data.txt

      - name: Install data dependencies
        run: python -m pip install -r requirements-data.txt

      - name: Build source data
        run: python scripts/build_data.py

      - name: Build pipeline report
        run: python scripts/build_pipeline_report.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Create visual review sheets
        run: python scripts/review_pdf.py
        continue-on-error: true

      - name: Upload extraction review artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobvision-1405-review
          path: |
            data/metadata/jobvision_review_queue.csv
            data/metadata/page_contact_sheets/**
            site/data/pipeline_status.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/jobvision_metrics.json                   site/data/jobvision_mapping_issues.json                   site/data/matches.json                   site/data/pipeline_status.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "data: rebuild JobVision 1405 pipeline"
            git push
          fi
